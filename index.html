.study-card{aspect-ratio:3/4;width:100%;max-width:440px;margin-left:auto;margin-right:auto}

.quiz-card .quiz-question{

  grid-column:1;

  position:relative;
  left:auto;
  right:auto;
  top:auto;
  align-self:center;

  z-index:1;

<style id="quiz-answer-reveal">

<style id="mobile-text-scale">

  #studyCard .kanji{font-size:calc(clamp(40px,6vw,54px)*.7)!important}
  .quiz-card .quiz-question .kanji{font-size:calc(48px*.7)!important}
  .quiz-card.quiz-revealed .quiz-question .kanji{font-size:calc(58.1px*.7)!important}
  .detail-card .kanji{font-size:calc(clamp(66px,10vw,92px)*.7)}

  #studyCard .kana{font-size:calc(16px*.85)!important;transform:translateY(-42px)}
  .quiz-card .quiz-question p{font-size:calc(13.2px*.85)!important;transform:translateY(-39px)}
  .quiz-card.quiz-revealed .quiz-question p{font-size:calc(15.4px*.85)!important;transform:translateY(-45px)}

function stopAutoplay(){$('autoplay').textContent='▶';$('autoplay').setAttribute('aria-label','재생');$('autoplay').title='재생';$('autoplay').setAttribute('aria-pressed','false');if(playTimer!==null){clearInterval(playTimer);playTimer=null}}function startAutoplayTimer(){if(playTimer!==null)clearInterval(playTimer);playTimer=setInterval(()=>move(1),3000/speedRates[speedIndex])}function renderSpeed(){const speed=speedRates[speedIndex],symbol=speed===0.2?'⅕':speed===0.5?'½':`${speed}×`;$('speedToggle').textContent=symbol;$('speedToggle').title=`배속 ${speed}×`;$('speedToggle').setAttribute('aria-label',`자동 넘김 ${speed}배속`)}$('speedToggle').onclick=()=>{speedIndex=(speedIndex+1)%speedRates.length;renderSpeed();if(playTimer!==null)startAutoplayTimer()};$('autoplay').onclick=()=>{if(playTimer!==null){stopAutoplay()}else{$('autoplay').textContent='⏸';$('autoplay').setAttribute('aria-label','멈춤');$('autoplay').title='멈춤';$('autoplay').setAttribute('aria-pressed','true');startAutoplayTimer()}};

$('studyCard').onclick=e=>{if(e.target.closest('button,select'))return;meaningShown=!meaningShown;renderCard()};$('studyCard').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();meaningShown=!meaningShown;renderCard()}};$('yomiToggle').onclick=()=>{meaningShown=false;revealStage=revealStage===1?0:1;renderCard()};$('quizYomiToggle').onclick=()=>{quizReadingShown=!quizReadingShown;$('quizYomiToggle').setAttribute('aria-pressed',String(quizReadingShown));const kana=$('quizReading');if(kana)kana.hidden=!quizReadingShown};function refreshFilteredWords(){order=shuffleArray(words.map((_,i)=>i).filter(i=>matchesFilters(words[i])));index=0;meaningShown=false;renderCard();if($('quiz').classList.contains('active'))startQuiz();if($('bookmarks').classList.contains('active')){bookmarkPage=0;renderBookmarks()}}function updateGroup(value){selectedGroup=value;['groupSelect','quizGroupSelect','bookmarksGroupSelect'].forEach(id=>$(id).value=value);refreshFilteredWords()}$('groupSelect').onchange=e=>updateGroup(e.target.value);$('quizGroupSelect').onchange=e=>updateGroup(e.target.value);$('bookmarksGroupSelect').onchange=e=>updateGroup(e.target.value);$('quizYomiToggle').hidden=false;$('quizModeToggle').textContent=quizMode==='reading'?'あ':'か';$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('shuffle').onclick=()=>{shuffleArray(order);index=0;meaningShown=false;renderCard()};$('bookmark').onclick=e=>{e.stopPropagation();const id=order[index];bookmarks.has(id)?bookmarks.delete(id):bookmarks.add(id);localStorage.setItem('kotoba-empty-bookmarks-user-list-v2',JSON.stringify([...bookmarks]));renderCard()};

function renderBookmarks(){const groupOrder=['1-1','1-2','1-3','1-4','1-5','1-6','1-7','1-8','1-9','1-10','1-11','1-12','1-13','1-14','1-15','1-16','1-17','1-18','1-19','1-20','1-21','1-22','1-23','1-24','1-25','1-26','1-27','1-28','1-29','1-30','1-31','1-32','1-33','1-34','1-35','1-36','1-37','1-38','1-39','1-40','1-41','1-42','2-1','2-2','2-3','2-6','2-10','2-11','2-12','2-13','2-14','2-18','2-19','2-23','2-24','2-25','2-26','2-27','2-28','3-1','3-2','3-3','3-4','3-5','3-7','3-8','8-0','8-1','8-2','8-3','8-4','8-5','8-6','8-7','8-8','9-0','9-1','9-2','9-3','9-4','9-5','9-6','10-0','10-2','10-3','10-6','11-0','11-1','11-2','11-6','12-0','12-1','12-2','12-5','12-6','13-0','13-1','13-2','13-6'];const list=[...bookmarks].map(i=>words[i]).filter(Boolean).filter(matchesFilters).sort((a,b)=>groupOrder.indexOf(a.group)-groupOrder.indexOf(b.group)||words.indexOf(a)-words.indexOf(b));const pages=Math.max(1,Math.ceil(list.length/20));bookmarkPage=Math.max(0,Math.min(bookmarkPage,pages-1));const visible=list.slice(bookmarkPage*20,(bookmarkPage+1)*20);$('bookmarkList').innerHTML=visible.map(w=>`<div class="word-row"><div class="word-group">${groupLabel(w.group)}</div><div><div class="word-jp">${w.jp}</div><div class="word-reading">${w.kana}</div></div><div class="word-meaning">${w.ko}</div></div>`).join('');$('bookmarkPageLabel').textContent=`${bookmarkPage+1} / ${pages}`;$('bookmarkPrev').disabled=bookmarkPage===0;$('bookmarkNext').disabled=bookmarkPage>=pages-1;$('resetBookmarks').disabled=bookmarks.size===0}
$('bookmarkPrev').onclick=()=>{bookmarkPage--;renderBookmarks()};$('bookmarkNext').onclick=()=>{bookmarkPage++;renderBookmarks()};$('resetBookmarks').onclick=()=>{bookmarks.clear();localStorage.removeItem('kotoba-empty-bookmarks-user-list-v2');bookmarkPage=0;renderBookmarks();renderCard()};
function beginQuiz(items){if(quizMode==='reading')items=items.filter(w=>w.kana&&w.kana.trim());warmFonts(items.slice(0,15));quizItems=items;quizIndex=0;score=0;answered=false;wrongItems=[];quizReadingShown=false;$('quizYomiToggle').setAttribute('aria-pressed','false');renderQuiz()}
function startQuiz(){const pool=words.filter(matchesFilters);beginQuiz([...pool].sort(()=>Math.random()-.5))}
function startWrongQuiz(){const retryItems=[...wrongItems];if(retryItems.length)beginQuiz(retryItems)}
function renderWrongList(){const pageCount=Math.max(1,Math.ceil(wrongItems.length/20));wrongPage=Math.max(0,Math.min(wrongPage,pageCount-1));const pageItems=wrongItems.slice(wrongPage*20,(wrongPage+1)*20);$('wrongPageLabel').textContent=`${wrongPage+1} / ${pageCount}`;$('wrongPrev').disabled=wrongPage===0;$('wrongNext').disabled=wrongPage>=pageCount-1;$('wrongList').innerHTML=pageItems.map(w=>`<div class="word-row"><div><div class="word-jp">${w.jp}</div><div class="word-reading">${w.kana}</div></div><div class="word-meaning">${w.ko}</div></div>`).join('')}
function renderQuiz(){
 const rid=++quizRenderId;$('quizCard').classList.remove('quiz-revealed');
 if(!quizItems.length){$('quizCard').innerHTML='<div class="quiz-top"><span>0 / 0</span></div><div class="quiz-result"><p>'+(quizMode==='reading'?'이 범위에는 발음 맞추기로 낼 수 있는 단어가 없어요.<br>퀴즈 유형 버튼을 눌러 뜻 맞추기로 바꿔 보세요.':'퀴즈로 낼 단어가 없어요.')+'</p></div>';return}
 if(quizIndex>=quizItems.length){
  wrongPage=0;
  $('quizCard').innerHTML=`<div class="quiz-top"><span>${score} / ${quizItems.length}</span></div><div class="quiz-result">${wrongItems.length?`<div class="wrong-list" id="wrongList"></div><div class="wrong-pager"><button class="btn" id="wrongPrev" aria-label="이전 페이지">←</button><span class="wrong-page-label" id="wrongPageLabel"></span><button class="btn" id="wrongNext" aria-label="다음 페이지">→</button></div>`:''}</div><div class="buttons"><button class="btn" id="quizRestart">다시하기</button><button class="btn" id="retryWrong" ${wrongItems.length?'':'disabled'}>틀린 단어</button></div>`;
  $('quizRestart').onclick=startQuiz;$('retryWrong').onclick=startWrongQuiz;
  if(wrongItems.length){$('wrongPrev').onclick=()=>{wrongPage--;renderWrongList()};$('wrongNext').onclick=()=>{wrongPage++;renderWrongList()};renderWrongList()}
  return
 }
 const w=quizItems[quizIndex],answer=quizAnswer(w),wrongChoices=quizWrongChoices(w),options=[answer,...wrongChoices].sort(()=>Math.random()-.5),questionReading=w.kana;
 $('quizCard').innerHTML=`<div class="quiz-top"><span>${quizIndex+1} / ${quizItems.length}</span></div><div class="quiz-question"><div class="kanji">${w.jp}</div><p id="quizReading" ${quizReadingShown?'':'hidden'}>${questionReading}</p><div class="quiz-meaning" id="quizMeaning" hidden>${w.ko}</div></div><div class="answers" id="quizAnswers">${options.map(a=>`<button class="answer" data-answer="${a.replaceAll('"','&quot;')}">${a}</button>`).join('')}</div>`;
 document.querySelectorAll('.answer').forEach(btn=>btn.onclick=()=>{if(answered)return;answered=true;const correct=btn.dataset.answer===quizAnswer(w);if(correct){score++;btn.classList.add('correct')}else{wrongItems.push(w);btn.classList.add('wrong')}setTimeout(()=>{if(rid!==quizRenderId)return;const rd=$('quizReading');if(rd&&w.kana)rd.hidden=false;$('quizMeaning').hidden=false;const box=$('quizAnswers');$('quizCard').classList.add('quiz-revealed');box.classList.add('quiz-answers-back');box.innerHTML='<button class="quiz-back" id="quizNext" type="button">'+(quizIndex>=quizItems.length-1?'결과 보기':'다음')+'</button>';const nx=$('quizNext');nx.onclick=()=>{quizIndex++;answered=false;renderQuiz()};nx.focus({preventScroll:true})},700)})
}
