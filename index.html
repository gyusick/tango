  place-content:center;
  gap:0;

  margin:0;
  transform:translateY(-70px);
  z-index:1;

$('studyCard').onclick=e=>{if(e.target.closest('button'))return;meaningShown=!meaningShown;renderCard()};$('studyCard').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();meaningShown=!meaningShown;renderCard()}};$('yomiToggle').onclick=()=>{meaningShown=false;revealStage=(revealStage+1)%3;renderCard()};$('quizYomiToggle').onclick=()=>{quizReadingShown=!quizReadingShown;$('quizYomiToggle').setAttribute('aria-pressed',String(quizReadingShown));const kana=$('quizReading');if(kana)kana.hidden=!quizReadingShown};function refreshFilteredWords(){order=words.map((_,i)=>i).filter(i=>matchesFilters(words[i]));index=0;meaningShown=false;renderCard();if($('quiz').classList.contains('active'))startQuiz();if($('bookmarks').classList.contains('active')){bookmarkPage=0;renderBookmarks()}}function updateGroup(value){selectedGroup=value;['groupSelect','quizGroupSelect','bookmarksGroupSelect'].forEach(id=>$(id).value=value);refreshFilteredWords()}$('groupSelect').onchange=e=>updateGroup(e.target.value);$('quizGroupSelect').onchange=e=>updateGroup(e.target.value);$('bookmarksGroupSelect').onchange=e=>updateGroup(e.target.value);$('quizYomiToggle').hidden=false;$('quizModeToggle').textContent=quizMode==='reading'?'あ':'か';$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('shuffle').onclick=()=>{order.sort(()=>Math.random()-.5);index=0;meaningShown=false;renderCard()};$('bookmark').onclick=e=>{e.stopPropagation();const id=order[index];bookmarks.has(id)?bookmarks.delete(id):bookmarks.add(id);localStorage.setItem('kotoba-empty-bookmarks-user-list-v2',JSON.stringify([...bookmarks]));renderCard()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');if(b.dataset.tab==='quiz')startQuiz();if(b.dataset.tab==='bookmarks')renderBookmarks();if(b.dataset.tab!=='study'&&playTimer!==null)stopAutoplay()});
function renderBookmarks(){const groupOrder=['1-1','1-2','1-3','1-4','1-5','1-6','1-7','1-8','1-9','1-10','1-11','1-16','1-17','1-18','1-19','1-20','1-21','1-22','1-27','1-28','1-29','1-30','1-36','1-37','1-38','1-39','1-40','1-41','1-42','2-1','2-2','2-3','2-14','3-3','3-4','3-5','8-4','8-5','8-6','8-7','8-8','9-1','9-2','9-3','9-4','9-5','9-6','10-0','10-2','10-3','11-0','11-1','11-2','12-0','12-1','12-2','13-0','13-1'];const list=[...bookmarks].map(i=>words[i]).filter(Boolean).filter(matchesFilters).sort((a,b)=>groupOrder.indexOf(a.group)-groupOrder.indexOf(b.group)||words.indexOf(a)-words.indexOf(b));const pages=Math.max(1,Math.ceil(list.length/20));bookmarkPage=Math.max(0,Math.min(bookmarkPage,pages-1));const visible=list.slice(bookmarkPage*20,(bookmarkPage+1)*20);$('bookmarkList').innerHTML=visible.map(w=>`<div class="word-row"><div class="word-group">${groupLabel(w.group)}</div><div><div class="word-jp">${w.jp}</div><div class="word-reading">${w.kana}</div></div><div class="word-meaning">${w.ko}</div></div>`).join('');$('bookmarkPageLabel').textContent=`${bookmarkPage+1} / ${pages}`;$('bookmarkPrev').disabled=bookmarkPage===0;$('bookmarkNext').disabled=bookmarkPage>=pages-1;$('resetBookmarks').disabled=bookmarks.size===0}
$('bookmarkPrev').onclick=()=>{bookmarkPage--;renderBookmarks()};$('bookmarkNext').onclick=()=>{bookmarkPage++;renderBookmarks()};$('resetBookmarks').onclick=()=>{bookmarks.clear();localStorage.removeItem('kotoba-empty-bookmarks-user-list-v2');bookmarkPage=0;renderBookmarks();renderCard()};
function beginQuiz(items){quizItems=items;quizIndex=0;score=0;answered=false;wrongItems=[];quizReadingShown=false;$('quizYomiToggle').setAttribute('aria-pressed','false');renderQuiz()}
function startQuiz(){const pool=words.filter(matchesFilters);beginQuiz([...pool].sort(()=>Math.random()-.5))}
function startWrongQuiz(){const retryItems=[...wrongItems];if(retryItems.length)beginQuiz(retryItems)}
function renderWrongList(){const pageCount=Math.max(1,Math.ceil(wrongItems.length/20));wrongPage=Math.max(0,Math.min(wrongPage,pageCount-1));const pageItems=wrongItems.slice(wrongPage*20,(wrongPage+1)*20);$('wrongPageLabel').textContent=`${wrongPage+1} / ${pageCount}`;$('wrongPrev').disabled=wrongPage===0;$('wrongNext').disabled=wrongPage>=pageCount-1;$('wrongList').innerHTML=pageItems.map(w=>`<div class="word-row"><div><div class="word-jp">${w.jp}</div><div class="word-reading">${w.kana}</div></div><div class="word-meaning">${w.ko}</div></div>`).join('')}
function renderQuiz(){
 if(quizIndex>=quizItems.length){
  wrongPage=0;
  $('quizCard').innerHTML=`<div class="quiz-top"><span>${score} / ${quizItems.length}</span></div><div class="quiz-result">${wrongItems.length?`<div class="wrong-list" id="wrongList"></div><div class="wrong-pager"><button class="btn" id="wrongPrev" aria-label="이전 페이지">←</button><span class="wrong-page-label" id="wrongPageLabel"></span><button class="btn" id="wrongNext" aria-label="다음 페이지">→</button></div>`:''}</div><div class="buttons"><button class="btn" id="quizRestart">다시하기</button><button class="btn" id="retryWrong" ${wrongItems.length?'':'disabled'}>틀린 단어</button></div>`;
  $('quizRestart').onclick=startQuiz;$('retryWrong').onclick=startWrongQuiz;
  if(wrongItems.length){$('wrongPrev').onclick=()=>{wrongPage--;renderWrongList()};$('wrongNext').onclick=()=>{wrongPage++;renderWrongList()};renderWrongList()}
  return
 }
 const w=quizItems[quizIndex],answer=quizAnswer(w),wrongChoices=quizWrongChoices(w),options=[answer,...wrongChoices].sort(()=>Math.random()-.5),questionReading=w.kana;
 $('quizCard').innerHTML=`<div class="quiz-top"><span>${quizIndex+1} / ${quizItems.length}</span></div><div class="quiz-question"><div class="kanji">${w.jp}</div><p id="quizReading" ${quizReadingShown?'':'hidden'}>${questionReading}</p></div><div class="answers">${options.map(a=>`<button class="answer" data-answer="${a.replaceAll('"','&quot;')}">${a}</button>`).join('')}</div>`;
 document.querySelectorAll('.answer').forEach(btn=>btn.onclick=()=>{if(answered)return;answered=true;const correct=btn.dataset.answer===quizAnswer(w);if(correct){score++;btn.classList.add('correct')}else{wrongItems.push(w);btn.classList.add('wrong')}setTimeout(()=>{quizIndex++;answered=false;renderQuiz()},850)})
}
renderSpeed();renderCard();renderBookmarks();
</script>
