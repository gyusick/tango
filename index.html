        .screen {

        .hidden {

        }

        .main-buttons button {
            width: 180px;
            height: 100px;

            font-weight: bold;
        }


        #quizWord,

            font-size: 100px;
            font-weight: bold;

            align-items: center;

            margin: 0;
        }


        #quizHint {

            height: 50px;

            justify-content: center;

        }

        #quizMeaning {
            font-size: 30px;

            width: 100%;
            height: 40px;

            display: flex;
            justify-content: center;

        }

        #checkedScreen h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        #checkedCount {
            font-size: 18px;
            color: #f5f5f5;
            margin-bottom: 25px;
        }

        #checkedList {
            width: 100%;
            max-height: 55vh;
            overflow-y: auto;
            text-align: left;
            padding: 0 20px;
        }

        .checked-item {
            display: flex;
            align-items: baseline;
            gap: 18px;
            padding: 12px 5px;
            border-bottom: 1px solid #ddd;
        }

        .checked-kanji {
            font-size: 30px;
            font-weight: bold;
            min-width: 110px;
        }

        .checked-reading {
            font-size: 18px;
            color: #f5f5f5;
            min-width: 110px;
        }

        .checked-meaning {
            font-size: 18px;
        }

    #wordList {
        display: grid;
        grid-template-columns: repeat(3, 1fr);

        width: 100%;
        min-height: 600px;
        align-content: start;
    }

    .word-list-item {
        border: 1px solid #f5f5f5;

    .word-list-kanji {

#studyScreen {
    position: relative;
    text-align: center;
}

.study-word-area {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    max-width: 700px;

    height: 140px;
    margin: 40px auto 10px;
}

#studyWord {

    text-align: center;
}

.study-nav {
    width: 55px;
    height: 55px;

    border: none;
    border-radius: 50%;

    font-size: 36px;
    line-height: 1;

    cursor: pointer;
}

.study-prev {
    margin-right: 25px;
}

.study-next {
    margin-left: 25px;
}

.bookmark-button {
    position: absolute;

    top: -10px;
    right: 80px;

    width: 32px;
    height: 32px;

    padding: 0;

    border: none;
    background: none;

    font-size: 24px;
    line-height: 1;

    cursor: pointer;
}

.bookmark-button.active {
    font-size: 24px;
}

#studyReading {
    height: 32px;
    margin-top: 10px;

    font-size: 25px;
    line-height: 1.4;
}

#studyMeaning {
    height: 32px;
    margin-top: 2px;

    font-size: 20px;
    line-height: 1.4;
}

#studyCount {
    margin-top: 12px;
    margin-bottom: 22px;

    font-size: 15px;
}

.study-buttons button {
    min-width: 90px;
    height: 42px;

    padding: 0 18px;

    font-size: 16px;

    cursor: pointer;
}

#studyAnswerToggle {
    min-width: 120px;
}

.study-bottom-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;

    margin-top: 25px;
}

.study-bottom-buttons button {
    min-width: 100px;
    height: 42px;

    cursor: pointer;
}

<button class="home-button" onclick="returnToStudy()">

</button>

<button class="home-button" onclick="goHome()">

</button>

</div>


<div id="quizScreen" class="screen hidden">

<div id="quizCount">

</div>

    <div id="quizHint"></div>

<div class="quiz-buttons">

<button onclick="showQuizAnswerA()">♪</button>
<button onclick="showQuizAnswerB()">✎</button>

</div>


    <div class="quiz-buttons">

        <button onclick="prevQuizWord()">
            ≪
        </button>

        <button onclick="nextQuizWord()">
            ≫
        </button>

    </div>


<button class="home-button" onclick="openGroupSelect('quiz')">
    ☜
</button>

<button class="home-button" onclick="goHome()">
    
</button>

<button class="home-button" onclick="openWordList()">
    ≡
</button>

</div>

<div id="studyScreen" class="screen hidden">

    <div class="study-word-area">

        <button
            id="studyBookmark"
            class="bookmark-button"
            type="button"
            onclick="toggleStudyCheck()"
            aria-label="현재 단어 체크"
            title="현재 단어 체크">
            ☆
        </button>

        <button
            class="study-nav study-prev"
            onclick="prevStudyWord()">
            ‹
        </button>

        <div id="studyWord">
            ▶︎
        </div>

        <button
            class="study-nav study-next"
            onclick="nextStudyWord()">
            ›
        </button>

    </div>

    <div id="studyReading">
    </div>

    <div id="studyMeaning">
    </div>

    <div id="studyCount">
        0 / 0
    </div>

    <div class="study-buttons">

        <button
            id="studyAnswerToggle"
            onclick="toggleStudyAnswer()">
            ♪
        </button>

    </div>

    <div class="study-buttons">

        <button
            id="studyToggleButton"
            onclick="toggleStudy()">
            ▶︎
        </button>

        <button onclick="resetStudy()">
            ⚄
        </button>

    </div>

    <div class="study-buttons">

        <button onclick="openCheckedWords()">
            ★
        </button>

        <button onclick="openWordList()">
            ≡
        </button>

    </div>

    <div class="study-bottom-buttons">

        <button
            class="home-button"
            onclick="openGroupSelect('study')">
            ☜
        </button>

        <button
            class="home-button"
            onclick="goHome()">
            
        </button>

    </div>

</div>


<div id="checkedScreen" class="screen hidden">
    <h1>체크한 단어</h1>

    <div id="checkedCount"></div>

    <div id="checkedList"></div>

    <button class="home-button" onclick="openStudy()">
        ☜
    </button>

    <button class="delete-all-button" onclick="clearAllCheckedWords()">
        reset
    </button>

    <button class="home-button" onclick="goHome()">
        
    </button>
</div>

let quizIndex = 0;
let quizWords = [];

function shuffle(array) {
    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
}

function openQuiz() {
    hideAllScreens();
    document.getElementById("quizScreen").classList.remove("hidden");

quizWords = words.filter(
    word => word.group === selectedGroup
);
    quizIndex = 0;

    showQuizWord();
}

function showQuizWord() {
    const word = quizWords[quizIndex];

    if (!word) return;

    document.getElementById("quizWord").textContent = word.kanji;
    document.getElementById("quizCount").textContent =
        (quizIndex + 1) + " / " + quizWords.length;
    document.getElementById("quizHint").textContent = "";
    document.getElementById("quizMeaning").textContent = "";
    }

function prevQuizWord() {
    quizIndex--;

    if (quizIndex < 0) {
        quizIndex = quizWords.length - 1;
    }

    showQuizWord();
}

function showQuizAnswerA() {
    const word = quizWords[quizIndex];

    if (!word) return;

    const hint = document.getElementById("quizHint");

    if (hint.textContent === "") {
        hint.textContent = word.yomigana;
    } else {
        hint.textContent = "";
    }
}

function showQuizAnswerB() {
    const word = quizWords[quizIndex];

    if (!word) return;

    const meaning = document.getElementById("quizMeaning");

    if (meaning.textContent === "") {
        meaning.textContent = word.meaning;
    } else {
        meaning.textContent = "";
    }
}

function nextQuizWord() {
    quizIndex++;

if (quizIndex >= quizWords.length) {
    quizIndex = 0;
}

    showQuizWord();
}


let checkedWords = JSON.parse(
    localStorage.getItem("checkedJapaneseWords") || "[]"
);

function isWordChecked(kanji) {
    return checkedWords.includes(kanji);
}

function saveCheckedWords() {
    localStorage.setItem(
        "checkedJapaneseWords",
        JSON.stringify(checkedWords)
    );
}

function getCurrentStudyWord() {
    if (!studyWords.length) return null;

    return studyWords[studyIndex] || null;
}

function updateStudyBookmark() {
    const button = document.getElementById("studyBookmark");
    const word = getCurrentStudyWord();

    if (!button) return;

    const active = word && isWordChecked(word.kanji);

    button.textContent = active ? "★" : "☆";
    button.classList.toggle("active", !!active);
    button.setAttribute(
        "aria-label",
        active ? "체크 해제" : "현재 단어 체크"
    );
    button.setAttribute(
        "title",
        active ? "체크 해제" : "현재 단어 체크"
    );
}

function toggleStudyCheck() {
    const word = getCurrentStudyWord();

    if (!word) return;

    clearInterval(studyTimer);
    studyTimer = null;
    studyPlaying = false;

    document.getElementById("studyToggleButton").textContent = "▶︎";

    if (isWordChecked(word.kanji)) {
        checkedWords = checkedWords.filter(
            kanji => kanji !== word.kanji
        );
    } else {
        checkedWords.push(word.kanji);
    }

    saveCheckedWords();
    updateStudyBookmark();
}

function openCheckedWords() {
    clearInterval(studyTimer);
    studyTimer = null;
    studyPlaying = false;

    hideAllScreens();
    document.getElementById("checkedScreen").classList.remove("hidden");

    renderCheckedWords();
}

function renderCheckedWords() {
    const list = document.getElementById("checkedList");
    const count = document.getElementById("checkedCount");

    const checked = words.filter(word =>
        checkedWords.includes(word.kanji)
    );

    count.textContent = `총 ${checked.length}개`;

    if (checked.length === 0) {
        list.innerHTML = "<p>(null)</p>";
        return;
    }

    list.innerHTML = "";

    checked.forEach(word => {
        const item = document.createElement("div");
        item.className = "checked-item";

        const kanji = document.createElement("div");
        kanji.className = "checked-kanji";
        kanji.textContent = word.kanji;

        const reading = document.createElement("div");
        reading.className = "checked-reading";
        reading.textContent = word.yomigana;

        const meaning = document.createElement("div");
        meaning.className = "checked-meaning";
        meaning.textContent = word.meaning;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-check-button";
        deleteButton.textContent = "reset";
        deleteButton.title = "체크 해제";
        deleteButton.addEventListener("click", () => {
            removeCheckedWord(word.kanji);
        });

        item.appendChild(kanji);
        item.appendChild(reading);
        item.appendChild(meaning);
        item.appendChild(deleteButton);

        list.appendChild(item);
    });
}

function removeCheckedWord(kanji) {
    checkedWords = checkedWords.filter(
        word => word !== kanji
    );

    saveCheckedWords();
    renderCheckedWords();
    updateStudyBookmark();
    clearInterval(studyTimer);
studyTimer = null;
studyPlaying = false;
}


let studyWords = [];
let studyIndex = 0;
let studyTimer = null;
let studyPlaying = false;
let selectedGroup = null;
let selectedMode = null;

let studyAnswerState = 0;

const STUDY_INTERVAL = 3000;

function openStudy() {
    hideAllScreens();
    document.getElementById("studyScreen").classList.remove("hidden");

    clearInterval(studyTimer);
    studyTimer = null;
    studyPlaying = false;

    studyAnswerState = 0;

    document.getElementById("studyToggleButton").textContent = "▶︎";
    document.getElementById("studyAnswerToggle").textContent = "♪";

    showStudyWord();
    updateStudyBookmark();
}

function showStudyWord() {
    const word = getCurrentStudyWord();

    if (!word) return;

    document.getElementById("studyWord").textContent =
        word.kanji;

    if (studyAnswerState >= 1) {
        document.getElementById("studyReading").textContent =
            word.yomigana;
    } else {
        document.getElementById("studyReading").textContent =
            "";
    }

    if (studyAnswerState >= 2) {
        document.getElementById("studyMeaning").textContent =
            word.meaning;
    } else {
        document.getElementById("studyMeaning").textContent =
            "";
    }

    document.getElementById("studyCount").textContent =
        (studyIndex + 1) + " / " + studyWords.length;

    updateStudyBookmark();
}

function toggleStudyAnswer() {
    studyAnswerState++;

    if (studyAnswerState > 2) {
        studyAnswerState = 0;
    }

    const button =
        document.getElementById("studyAnswerToggle");

    if (studyAnswerState === 0) {
        button.textContent = "♪";
    } else if (studyAnswerState === 1) {
        button.textContent = "✎";
    } else {
        button.textContent = "⟲";
    }

    showStudyWord();
}

function prevStudyWord() {
    if (!studyWords.length) return;

    studyIndex--;

    if (studyIndex < 0) {
        studyIndex = studyWords.length - 1;
    }

    showStudyWord();
}

function nextStudyWord() {
    if (!studyWords.length) return;

    studyIndex++;

    if (studyIndex >= studyWords.length) {

        if (selectedGroup === "ALL") {
            studyWords = shuffle(words);
        } else {
            studyWords = shuffle(
                words.filter(
                    word => word.group === selectedGroup
                )
            );
        }

        studyIndex = 0;
    }

    showStudyWord();
}

function toggleStudy() {
    if (!studyWords.length) return;

    if (studyPlaying) {
        clearInterval(studyTimer);
        studyTimer = null;
        studyPlaying = false;

        document.getElementById("studyToggleButton").textContent = "▶︎";
    } else {
        showStudyWord();

        studyPlaying = true;

        clearInterval(studyTimer);

        studyTimer = setInterval(() => {
            nextStudyWord();
        }, STUDY_INTERVAL);
        document.getElementById("studyToggleButton").textContent = "❚❚";
    }
}

function resetStudy() {

    clearInterval(studyTimer);
    studyTimer = null;
    studyPlaying = false;

    if (selectedGroup === "ALL") {

        studyWords = shuffle(words);

    } else {

        studyWords = shuffle(
            words.filter(
                word => word.group === selectedGroup
            )
        );
    }

    studyIndex = 0;

    document
        .getElementById("studyToggleButton")
        .textContent = "▶︎";

    showStudyWord();
}

function clearAllCheckedWords() {
    checkedWords = [];

    saveCheckedWords();
    renderCheckedWords();
    updateStudyBookmark();
}

function openGroupSelect(mode) {
    selectedMode = mode;

    hideAllScreens();
    document.getElementById("groupScreen").classList.remove("hidden");

    if (mode === "quiz") {
        document.getElementById("groupTitle").textContent = "문제 그룹 선택";
    } else if (mode === "study") {
        document.getElementById("groupTitle").textContent = "학습 그룹 선택";
    } else {
        document.getElementById("groupTitle").textContent = "≡";
    }
}


function selectGroup(group) {
    selectedGroup = group;

    if (selectedMode === "quiz") {
        openQuiz();

    } else if (selectedMode === "study") {

        if (selectedGroup === "ALL") {
            studyWords = shuffle(words);
        } else {
            studyWords = shuffle(
                words.filter(
                    word => word.group === selectedGroup
                )
            );
        }

        studyIndex = 0;

        openStudy();
    }
}

let wordListPage = 0;
const WORDS_PER_PAGE = 18;

function openWordList() {

    hideAllScreens();

    document
        .getElementById("wordListScreen")
        .classList.remove("hidden");

    wordListPage = 0;

    renderWordList();
}

function renderWordList() {

    const list =
        document.getElementById("wordList");

    const title =
        document.getElementById("wordListTitle");

    const groupWords =
        selectedGroup === "ALL"
            ? words
            : words.filter(
            word => word.group === selectedGroup
        );

    const start =
        wordListPage * WORDS_PER_PAGE;

    const pageWords =
        groupWords.slice(
            start,
            start + WORDS_PER_PAGE
        );

    const totalPages =
        Math.ceil(
            groupWords.length / WORDS_PER_PAGE
        );

    title.textContent =
        selectedGroup === "ALL"
            ? "전체 단어"
            : selectedGroup + " 전체 단어";
        list.innerHTML = "";

        pageWords.forEach(word => {

        const item =
            document.createElement("div");

        item.className =
            "word-list-item";

        item.innerHTML =
            `<div class="word-list-kanji">
                ${word.kanji}
             </div>

             <div class="word-list-reading">
                ${word.yomigana}
             </div>

             <div class="word-list-meaning">
                ${word.meaning}
             </div>`;

        list.appendChild(item);
    });

    document
        .getElementById("wordListPage")
        .textContent =
        (wordListPage + 1)
        + " / "
        + totalPages;
}


function prevWordList() {

    if (wordListPage > 0) {

        wordListPage--;

    } else {

        const groupWords =
            selectedGroup === "ALL"
                ? words
                : words.filter(
                    word => word.group === selectedGroup
                );

        const totalPages =
            Math.ceil(
                groupWords.length / WORDS_PER_PAGE
            );

        wordListPage = totalPages - 1;
    }

    renderWordList();
}


function nextWordList() {

    const groupWords =
        selectedGroup === "ALL"
            ? words
            : words.filter(
                word => word.group === selectedGroup
            );

    const totalPages =
        Math.ceil(
            groupWords.length / WORDS_PER_PAGE
        );

    if (wordListPage < totalPages - 1) {

        wordListPage++;

    } else {

        wordListPage = 0;
    }

    renderWordList();
}

function returnToStudy() {

    hideAllScreens();

    document
        .getElementById("studyScreen")
        .classList.remove("hidden");

    showStudyWord();

    updateStudyBookmark();
}
